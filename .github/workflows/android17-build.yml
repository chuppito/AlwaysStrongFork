name: Android 17 - build verification
# Test build requested for chatgpt-bluejay-rkp on 2026-10-18

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/android17-build
      - chatgpt-bluejay-rkp
      - main
    paths:
      - 'build.sh'
      - 'module/**'
      - 'module-variants/**'
      - 'attest/**'
      - 'native/**'
      - '.github/workflows/android17-build.yml'

permissions:
  contents: write

jobs:
  package:
    name: Package and verify ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned branch
        uses: actions/checkout@v4
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip
      - name: Use committed native prebuilts
        run: find native -path '*/prebuilt/*' -type f -exec touch {} +
      - name: Build default variant
        run: bash build.sh --variant fork --clean
      - name: Validate installable archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(out/AlwaysStrong-*.zip)
          if (( ${#zips[@]} != 1 )); then
            echo "Expected exactly one ZIP; found ${#zips[@]}" >&2
            exit 1
          fi
          unzip -t "${zips[0]}" | tail -3
          unzip -Z1 "${zips[0]}" | grep -Eq '(^|/)module\.prop$'
          unzip -Z1 "${zips[0]}" | grep -Eq '(^|/)customize\.sh$|(^|/)install\.sh$'
          sha256sum "${zips[0]}" | tee out/SHA256SUMS.txt
      - name: Upload test artifact (ZIP inside artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-android17-test
          path: |
            out/AlwaysStrong-*.zip
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-install ZIP on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(out/AlwaysStrong-*.zip)
          tag=android17-latest
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "AlwaysStrong Android 17 - latest test build" --notes "Automated test build from main. ZIP is directly installable; Android integrity certification is not guaranteed." --prerelease
          fi
          gh release upload "$tag" "${zips[0]}" out/SHA256SUMS.txt --clobber
          echo "Direct ZIP: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "${zips[0]}")" >> "$GITHUB_STEP_SUMMARY"
